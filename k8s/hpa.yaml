apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: execution-api
  namespace: execution
  labels:
    app: execution-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: execution-api
  minReplicas: 1
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

apiVersion: v1
kind: ConfigMap
metadata:
  name: execution-config
  namespace: execution
  labels:
    app: execution-api
data:
  PORT: "3000"
  NODE_ENV: "production"
  AWS_REGION: "us-east-1"
  API_GATEWAY_URL: "__API_GATEWAY_URL__"
  SQS_EXECUTION_IN_URL: "__SQS_EXECUTION_IN_URL__"
  SQS_EXECUTION_IN_DLQ_URL: "__SQS_EXECUTION_IN_DLQ_URL__"
  SQS_OS_IN_URL: "__SQS_OS_IN_URL__"
  OS_SERVICE_BASE_URL: "__OS_SERVICE_BASE_URL__"
  DYNAMODB_TAREFAS_TABLE: "tech-challenge-producao-execution-tarefas"
  DYNAMODB_OUTBOX_TABLE: "tech-challenge-producao-execution-outbox"
  DYNAMODB_MENSAGENS_PROCESSADAS_TABLE: "tech-challenge-producao-execution-mensagens-processadas"
  JWT_ISSUER: "tech-challenge-auth"
  JWT_AUDIENCE: "tech-challenge-api"
  AWS_SDK_MAX_ATTEMPTS: "3"
  DYNAMODB_CONNECTION_TIMEOUT_MS: "5000"
  DYNAMODB_HTTP_ATTEMPT_TIMEOUT_MS: "4000"
  DYNAMODB_OPERATION_DEADLINE_MS: "12000"
  SQS_CONNECTION_TIMEOUT_MS: "5000"
  SQS_HTTP_ATTEMPT_TIMEOUT_MS: "12000"
  SQS_OPERATION_DEADLINE_MS: "45000"
  SQS_LONG_POLL_SECONDS: "10"
  SQS_VISIBILITY_TIMEOUT_SECONDS: "720"
  SQS_CONSUMER_HABILITADO: "true"
  SQS_CONSUMER_INTERVAL_MS: "1000"
  SQS_CONSUMER_LOTE: "3"
  OUTBOX_PUBLISHER_HABILITADO: "false"
  OUTBOX_PUBLISHER_INTERVAL_MS: "2000"
  OUTBOX_PUBLISHER_LOTE: "5"
  OUTBOX_REIVINDICACAO_MS: "480000"
  OUTBOX_GSI_MAX_PAGINAS: "8"
  OUTBOX_RETRY_BASE_MS: "1000"
  OUTBOX_RETRY_TETO_MS: "300000"
  OS_REQUEST_TIMEOUT_MS: "3000"
  TERMINATION_GRACE_PERIOD_SECONDS: "870"
  DD_SITE: "datadoghq.com"

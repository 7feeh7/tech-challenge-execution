name: Deploy Application

# Ordem na main (fora de terraform/**): test → terraform apply → imagem (SHA) → deploy.
on:
  push:
    branches: [main]
    paths-ignore:
      - "terraform/**"
      - "docs/**"
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  K8S_NAMESPACE: execution
  TF_ENVIRONMENT: producao
  TF_VERSION: 1.15.8
  TF_STATE_KEY: tech-challenge-execution/producao/terraform.tfstate
  OS_SERVICE_BASE_URL: http://oficina-api.oficina.svc.cluster.local

concurrency:
  group: execution-producao-pipeline
  cancel-in-progress: false

jobs:
  test:
    name: Build e Testes
    runs-on: ubuntu-latest
    env:
      DYNAMODB_ENDPOINT: http://localhost:8000
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn build
      - run: yarn test:cov
      - run: yarn test:int
      - run: yarn test:e2e

      - name: Terraform fmt e validate
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      - name: Terraform validate (sem backend)
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

      - name: Docker build e inspeção
        run: |
          docker build -t execution-ci:local .
          docker run --rm execution-ci:local sh -c '! test -f .env'

  terraform:
    name: Terraform do serviço
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: producao
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
          TF_STATE_LOCK_TABLE: ${{ secrets.TF_STATE_LOCK_TABLE }}
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${TF_STATE_LOCK_TABLE}"

      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan -no-color \
            -var="environment=${{ env.TF_ENVIRONMENT }}" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

  deploy:
    name: Deploy no EKS
    if: github.ref == 'refs/heads/main'
    needs: [test, terraform]
    runs-on: ubuntu-latest
    environment: producao
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolver parametros via SSM
        id: ssm
        run: |
          PREFIX="/tech-challenge/${{ env.TF_ENVIRONMENT }}"
          ECR=$(aws ssm get-parameter --name "${PREFIX}/infra/execution_ecr_repository_url" --query Parameter.Value --output text)
          EKS=$(aws ssm get-parameter --name "${PREFIX}/infra/eks_cluster_name" --query Parameter.Value --output text)
          IRSA=$(aws ssm get-parameter --name "${PREFIX}/infra/execution_irsa_role_arn" --query Parameter.Value --output text)
          API_GATEWAY_URL=$(aws ssm get-parameter --name "${PREFIX}/infra/api_gateway_url" --query Parameter.Value --output text)
          EXECUTION_IN=$(aws ssm get-parameter --name "${PREFIX}/infra/execution_in_queue_url" --query Parameter.Value --output text)
          EXECUTION_IN_DLQ=$(aws ssm get-parameter --name "${PREFIX}/infra/execution_in_dlq_url" --query Parameter.Value --output text 2>/dev/null || aws ssm get-parameter --name "${PREFIX}/infra/execution_in_dlq_url" --query Parameter.Value --output text)
          OS_IN=$(aws ssm get-parameter --name "${PREFIX}/infra/os_in_queue_url" --query Parameter.Value --output text)
          JWT_PUBLIC_ARN=$(aws ssm get-parameter --name "${PREFIX}/infra/jwt_public_secret_arn" --query Parameter.Value --output text)
          TOKEN_EXECUTION_OS_ARN=$(aws ssm get-parameter --name "${PREFIX}/infra/token_execution_os_secret_arn" --query Parameter.Value --output text)
          echo "ecr=$ECR" >> $GITHUB_OUTPUT
          echo "eks=$EKS" >> $GITHUB_OUTPUT
          echo "irsa=$IRSA" >> $GITHUB_OUTPUT
          echo "api_gateway_url=$API_GATEWAY_URL" >> $GITHUB_OUTPUT
          echo "execution_in=$EXECUTION_IN" >> $GITHUB_OUTPUT
          echo "execution_in_dlq=$EXECUTION_IN_DLQ" >> $GITHUB_OUTPUT
          echo "os_in=$OS_IN" >> $GITHUB_OUTPUT
          echo "jwt_public_arn=$JWT_PUBLIC_ARN" >> $GITHUB_OUTPUT
          echo "token_execution_os_arn=$TOKEN_EXECUTION_OS_ARN" >> $GITHUB_OUTPUT

      - name: Obter segredos da aplicação
        id: secrets
        env:
          JWT_PUBLIC_ARN: ${{ steps.ssm.outputs.jwt_public_arn }}
          TOKEN_EXECUTION_OS_ARN: ${{ steps.ssm.outputs.token_execution_os_arn }}
        run: |
          JWT_JSON=$(aws secretsmanager get-secret-value --secret-id "$JWT_PUBLIC_ARN" --query SecretString --output text)
          JWT=$(echo "$JWT_JSON" | jq -r 'if .publicKey then .publicKey elif .public_key then .public_key else . end')
          TOKEN_OS=$(aws secretsmanager get-secret-value --secret-id "$TOKEN_EXECUTION_OS_ARN" --query SecretString --output text | jq -r 'if .token then .token else . end')
          echo "jwt_public<<EOF" >> $GITHUB_OUTPUT
          echo "$JWT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "::add-mask::$TOKEN_OS"
          echo "os_token=$TOKEN_OS" >> $GITHUB_OUTPUT

      - uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2

      - name: Build e push imagem (SHA imutavel)
        env:
          IMAGE_TAG: ${{ github.sha }}
          ECR_REPOSITORY: ${{ steps.ssm.outputs.ecr }}
        run: |
          docker build -t "$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Configurar kubectl
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "${{ steps.ssm.outputs.eks }}"

      - name: Verificar GSIs DynamoDB
        run: |
          set -euo pipefail
          PREFIX="/tech-challenge/${{ env.TF_ENVIRONMENT }}"
          TAREFAS=$(aws ssm get-parameter --name "${PREFIX}/infra/dynamodb_tarefas_table_name" --query Parameter.Value --output text 2>/dev/null || echo "tech-challenge-producao-execution-tarefas")
          OUTBOX=$(aws ssm get-parameter --name "${PREFIX}/infra/dynamodb_outbox_table_name" --query Parameter.Value --output text 2>/dev/null || echo "tech-challenge-producao-execution-outbox")

          # Fail-closed: tabela inexistente, erro do describe-table ou índice ausente
          # interrompem o deploy; só o status ACTIVE libera o rollout.
          verificar_gsi() {
            local tabela="$1"
            local indice="$2"
            local status
            status=$(aws dynamodb describe-table --table-name "$tabela" \
              --query "Table.GlobalSecondaryIndexes[?IndexName=='${indice}'].IndexStatus | [0] || 'ausente'" \
              --output text)
            if [ "$status" != "ACTIVE" ]; then
              echo "::error::GSI ${indice} em ${tabela} não está ACTIVE (status: ${status})"
              exit 1
            fi
          }

          verificar_gsi "$TAREFAS" gsi-fila-tarefas
          verificar_gsi "$OUTBOX" gsi-publicacao-pendente

      - name: ServiceAccount, ConfigMap e Secret
        env:
          IRSA_ARN: ${{ steps.ssm.outputs.irsa }}
          API_GATEWAY_URL: ${{ steps.ssm.outputs.api_gateway_url }}
          SQS_EXECUTION_IN_URL: ${{ steps.ssm.outputs.execution_in }}
          SQS_EXECUTION_IN_DLQ_URL: ${{ steps.ssm.outputs.execution_in_dlq }}
          SQS_OS_IN_URL: ${{ steps.ssm.outputs.os_in }}
          JWT_PUBLIC_KEY: ${{ steps.secrets.outputs.jwt_public }}
          OS_SERVICE_TOKEN: ${{ steps.secrets.outputs.os_token }}
        run: |
          sed "s|EXECUTION_IRSA_ROLE_ARN|${IRSA_ARN}|g" k8s/serviceaccount.yaml | kubectl apply -f -
          sed -e "s|__API_GATEWAY_URL__|${API_GATEWAY_URL}|g" \
              -e "s|__SQS_EXECUTION_IN_URL__|${SQS_EXECUTION_IN_URL}|g" \
              -e "s|__SQS_EXECUTION_IN_DLQ_URL__|${SQS_EXECUTION_IN_DLQ_URL}|g" \
              -e "s|__SQS_OS_IN_URL__|${SQS_OS_IN_URL}|g" \
              -e "s|__OS_SERVICE_BASE_URL__|${OS_SERVICE_BASE_URL}|g" \
              k8s/configmap.yaml | kubectl apply -f -
          kubectl create secret generic execution-secret \
            --namespace "$K8S_NAMESPACE" \
            --from-literal=JWT_PUBLIC_KEY="$JWT_PUBLIC_KEY" \
            --from-literal=OS_SERVICE_TOKEN="$OS_SERVICE_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deployment, Service e HPA
        env:
          IMAGE_TAG: ${{ github.sha }}
          ECR_REPOSITORY: ${{ steps.ssm.outputs.ecr }}
        run: |
          sed -e "s|ECR_REPOSITORY_URL:__IMAGE_TAG__|${ECR_REPOSITORY}:${IMAGE_TAG}|g" \
              -e "s|__IMAGE_TAG__|${IMAGE_TAG}|g" \
              k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml

      - name: Aguardar rollout
        run: |
          kubectl rollout status deployment/execution-api \
            --namespace "$K8S_NAMESPACE" --timeout=300s

      - name: Smoke test — health readiness
        run: |
          kubectl run smoke-execution-${{ github.run_id }} \
            --namespace "$K8S_NAMESPACE" \
            --image=curlimages/curl:8.5.0 \
            --restart=Never \
            --command -- sleep 300
          kubectl wait --for=condition=Ready pod/smoke-execution-${{ github.run_id }} \
            --namespace "$K8S_NAMESPACE" --timeout=60s
          kubectl exec smoke-execution-${{ github.run_id }} -n "$K8S_NAMESPACE" -- \
            curl -sf "http://execution-api/health/ready"
          kubectl delete pod smoke-execution-${{ github.run_id }} -n "$K8S_NAMESPACE"

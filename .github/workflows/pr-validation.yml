name: PR Validation

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main, develop]
  push:
    branches: [develop]

env:
  DYNAMODB_ENDPOINT: http://localhost:8000
  AWS_REGION: us-east-1

jobs:
  titulo-conventional-commits:
    name: Título Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validar título do PR
        env:
          TITULO: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$TITULO" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?: .+'; then
            echo "Título fora do Conventional Commits: $TITULO"
            exit 1
          fi

  validate:
    name: Lint, Build e Testes
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --frozen-lockfile
      # O código de saída do `yarn audit` (Yarn Classic) ignora --level; o audit-ci falha só em vulnerabilidade alta ou crítica.
      - name: Auditoria de dependências de produção (alta e crítica, sem exceção)
        run: npx --yes audit-ci@7.1.0 --high --skip-dev
      - name: Auditoria completa de dependências (alta e crítica, exceção temporária em audit-ci.jsonc)
        run: npx --yes audit-ci@7.1.0 --config audit-ci.jsonc
      - run: yarn lint
      - run: yarn build
      - run: yarn test:cov
      - run: yarn test:int
      - run: yarn test:e2e

      - name: SonarCloud Scan
        if: github.event_name == 'pull_request'
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarCloud Quality Gate
        if: github.event_name == 'pull_request'
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Terraform fmt
        uses: hashicorp/setup-terraform@v3
      - name: Terraform validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

  security-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@v3.82.13
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: HEAD
          extra_args: --only-verified
